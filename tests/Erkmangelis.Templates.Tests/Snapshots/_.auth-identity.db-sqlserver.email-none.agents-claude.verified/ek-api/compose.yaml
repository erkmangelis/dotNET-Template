# Local run and the Raspberry Pi or VPS deployment. See docs/deployment.md.
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build
# With the HTTPS tunnel: docker compose --profile tunnel up -d --build
name: acme-notes

services:
  api:
    build:
      context: .
      target: final
    image: ${API_IMAGE:-acme-notes-api}:${API_TAG:-local}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # TLS ends at the tunnel; trust X-Forwarded-* only from the compose network.
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      Api__UseHttpsRedirection: "false"
      ConnectionStrings__Default: Server=db;Database=app;User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${API_PORT:-8080}:8080"
    stop_grace_period: 35s
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      target: migrator
    image: ${API_IMAGE:-acme-notes-api}-migrator:${API_TAG:-local}
    environment:
      ConnectionStrings__Default: Server=db;Database=app;User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    # Runs on amd64 only: there is no SQL Server image for ARM (a Raspberry Pi).
    image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${MSSQL_ACCEPT_EULA:?set MSSQL_ACCEPT_EULA=Y in .env to accept the SQL Server licence}
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    # Loopback only: reachable from `dotnet run` on this machine, never from the network.
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - api

volumes:
  db-data:
