# Prometheus scrapes the API's metrics (port 9464, inside the compose network) and evaluates the
# alert rules in alerts.yml, sending the ones that fire to Alertmanager.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9464"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9464"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
