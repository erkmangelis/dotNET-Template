# Unit tests for alerts.yml, run by promtool (see the comment at the top of alerts.yml).
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="api", instance="api:9464"}'
        values: "1 1 0 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: ApiDown
        exp_alerts: []
      - eval_time: 5m
        alertname: ApiDown
        exp_alerts:
          - exp_labels: { severity: critical, job: api, instance: "api:9464" }
            exp_annotations:
              summary: "api does not answer Prometheus"
              description: "api:9464 has failed every scrape for 2 minutes: the process is down or unreachable."

  - interval: 1m
    input_series:
      # 100 requests a minute, 10 of them failing.
      - series: 'http_server_request_duration_seconds_count{job="api", http_response_status_code="200"}'
        values: "0+90x20"
      - series: 'http_server_request_duration_seconds_count{job="api", http_response_status_code="500"}'
        values: "0+10x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: HighErrorRate
        exp_alerts:
          - exp_labels: { severity: critical, job: api }
            exp_annotations:
              summary: "More than 5% of api requests fail"
              description: "10% of requests answered 5xx over the last 5 minutes."

  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="api", http_response_status_code="200"}'
        values: "0+100x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: HighErrorRate
        exp_alerts: []
