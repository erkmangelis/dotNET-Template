# CodeQL code scanning: finds injection, path traversal, weak crypto and similar flaws in the C# code
# and the workflows, and shows them under Security > Code scanning. Free for public repositories;
# a private one needs GitHub Code Security. See docs/security-scanning.md.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build
        if: matrix.build-mode == 'manual'
        run: dotnet build -c Release
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
