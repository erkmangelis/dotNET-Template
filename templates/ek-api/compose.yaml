# Local run and the Raspberry Pi or VPS deployment. See docs/deployment.md.
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build
# With the HTTPS tunnel: docker compose --profile tunnel up -d --build
name: ek-app-slug

services:
  api:
    build:
      context: .
      target: final
    image: ${API_IMAGE:-ek-app-slug-api}:${API_TAG:-local}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # TLS ends at the tunnel; trust X-Forwarded-* only from the compose network.
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      Api__UseHttpsRedirection: "false"
#if (UsePostgres)
      ConnectionStrings__Default: Host=db;Database=app;Username=app;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
#elif (UseSqlServer)
      ConnectionStrings__Default: Server=db;Database=app;User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True
#elif (UseSqlite)
      ConnectionStrings__Default: Data Source=/data/app.db
#endif
#if (UseExternal)
      ExternalAuth__Providers__Google__ClientIds__0: ${GOOGLE_CLIENT_ID:-}
      ExternalAuth__Providers__Apple__ClientIds__0: ${APPLE_CLIENT_ID:-}
      ExternalAuth__Providers__Microsoft__ClientIds__0: ${MICROSOFT_CLIENT_ID:-}
#endif
#if (UseOidc)
      Oidc__Authority: ${OIDC_AUTHORITY:?set OIDC_AUTHORITY in .env}
      Oidc__Audience: ${OIDC_AUDIENCE:?set OIDC_AUDIENCE in .env}
      Oidc__RoleClaim: ${OIDC_ROLE_CLAIM:-roles}
#endif
#if (UseSmtp)
      Email__FromAddress: ${EMAIL_FROM:?set EMAIL_FROM in .env}
      Email__Smtp__Host: ${SMTP_HOST:?set SMTP_HOST in .env}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Email__Smtp__UserName: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
#endif
#if (UseStorage)
      Storage__ServiceUrl: ${STORAGE_SERVICE_URL:-http://storage:9000}
      Storage__PublicServiceUrl: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
      Storage__Region: ${STORAGE_REGION:-us-east-1}
      Storage__Bucket: ${STORAGE_BUCKET:-files}
      Storage__AccessKey: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      Storage__SecretKey: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
      Storage__CreateBucket: ${STORAGE_CREATE_BUCKET:-true}
      Files__Tus__Directory: /uploads
      Files__Scanning__Enabled: ${FILES_SCANNING:-false}
      Files__Scanning__Host: clamav
#endif
#if (UseRedis)
      ConnectionStrings__Cache: cache:6379,password=${CACHE_PASSWORD:?set CACHE_PASSWORD in .env}
#endif
#if (UseMonitoring)
      # Metrics for Prometheus on port 9464, which is not published: only the compose network reaches it.
      ASPNETCORE_HTTP_PORTS: "8080;9464"
      Monitoring__Prometheus__Enabled: "true"
      # Traces and logs go to the monitoring profile's collector. Set it empty in .env to send nothing.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4317}
#else
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
#endif
      # Load tests from one address turn it off (see docs/load-testing.md); keep it on in production.
      RateLimiting__Enabled: ${RATE_LIMITING_ENABLED:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    stop_grace_period: 35s
#if (UseSqlite && UseStorage)
    volumes:
      - app-data:/data
      - upload-data:/uploads
#elif (UseSqlite)
    volumes:
      - app-data:/data
#elif (UseStorage)
    volumes:
      - upload-data:/uploads
#endif
#if (UseDatabase)
    depends_on:
      migrate:
        condition: service_completed_successfully
#if (UseStorage)
      storage:
        condition: service_healthy
#endif
#if (UseRedis)
      cache:
        condition: service_healthy
#endif
#elif (UseRedis)
    depends_on:
      cache:
        condition: service_healthy
#endif
#if (UseWorker)

  # Runs the jobs the API queues (see docs/background-work.md).
  worker:
    build:
      context: .
      target: worker
    image: ${API_IMAGE:-ek-app-slug-api}-worker:${API_TAG:-local}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
#if (UsePostgres)
      ConnectionStrings__Default: Host=db;Database=app;Username=app;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
#elif (UseSqlServer)
      ConnectionStrings__Default: Server=db;Database=app;User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True
#elif (UseSqlite)
      ConnectionStrings__Default: Data Source=/data/app.db
#endif
#if (UseSmtp)
      Email__FromAddress: ${EMAIL_FROM:?set EMAIL_FROM in .env}
      Email__Smtp__Host: ${SMTP_HOST:?set SMTP_HOST in .env}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Email__Smtp__UserName: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
#endif
#if (UseRedis)
      ConnectionStrings__Cache: cache:6379,password=${CACHE_PASSWORD:?set CACHE_PASSWORD in .env}
#endif
#if (UseMonitoring)
      ASPNETCORE_HTTP_PORTS: "8080;9464"
      Monitoring__Prometheus__Enabled: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4317}
#else
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
#endif
    stop_grace_period: 35s
#if (UseSqlite)
    volumes:
      - app-data:/data
#endif
    depends_on:
      migrate:
        condition: service_completed_successfully
#if (UseRedis)
      cache:
        condition: service_healthy
#endif
#endif
#if (UseDatabase)

  migrate:
    build:
      context: .
      target: migrator
    image: ${API_IMAGE:-ek-app-slug-api}-migrator:${API_TAG:-local}
    environment:
#if (UsePostgres)
      ConnectionStrings__Default: Host=db;Database=app;Username=app;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
#elif (UseSqlServer)
      ConnectionStrings__Default: Server=db;Database=app;User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True
    depends_on:
      db:
        condition: service_healthy
#else
      ConnectionStrings__Default: Data Source=/data/app.db
    volumes:
      - app-data:/data
#endif
    restart: "no"
#endif
#if (UsePostgres)

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Loopback only: reachable from `dotnet run` on this machine, never from the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
#elif (UseSqlServer)

  db:
    # Runs on amd64 only: there is no SQL Server image for ARM (a Raspberry Pi).
    image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${MSSQL_ACCEPT_EULA:?set MSSQL_ACCEPT_EULA=Y in .env to accept the SQL Server licence}
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    # Loopback only: reachable from `dotnet run` on this machine, never from the network.
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
#endif

#if (UseStorage)
  # Private S3-compatible object storage on this machine (RustFS, Apache-2.0). To use Cloudflare R2
  # or another provider instead, remove this service and the api's dependency on it, and set the
  # STORAGE_* values in .env. Signed links point at STORAGE_PUBLIC_URL, so clients must reach it:
  # route a hostname to storage:9000 through the tunnel, as for the API.
  storage:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
    # Loopback only: signed links work from this machine. Expose it through the tunnel for clients elsewhere.
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9000}:9000"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Virus scanning: docker compose --profile scan up -d, with FILES_SCANNING=true. clamd downloads
  # its signatures at start, which takes a few minutes and about 1.5 GB of memory.
  clamav:
    image: clamav/clamav:1.5.4
    profiles: ["scan"]
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav

#endif
#if (UseOidc)
  # A development OpenID Connect provider: docker compose --profile sso up -d keycloak. It imports
  # keycloak/realm.json (user dev@example.com, password dev-password, role admin) and forgets
  # everything on restart. Admin console: http://localhost:8081 (admin / admin). Never deploy it.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    profiles: ["sso"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

#endif
#if (UseSmtp)
  # Catches mail for local testing: docker compose --profile mail up -d, with SMTP_HOST=mailpit,
  # SMTP_PORT=1025 and SMTP_SECURITY=None. Read the mail at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.32
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

#endif
#if (UseRedis)
  # The shared cache: Valkey, the BSD-licensed continuation of Redis, which the Redis client speaks to
  # unchanged. A cache only: nothing is written to disk, and the least recently used keys go when it
  # is full, so losing it costs only slower reads until it fills again.
  cache:
    image: valkey/valkey:9.1.3-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${CACHE_PASSWORD:?set CACHE_PASSWORD in .env}", "--maxmemory", "${CACHE_MAX_MEMORY:-128mb}", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    environment:
      REDISCLI_AUTH: ${CACHE_PASSWORD:?set CACHE_PASSWORD in .env}
    # Loopback only: reachable from `dotnet run` on this machine, never from the network.
    ports:
      - "127.0.0.1:${CACHE_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

#endif
#if (UseMonitoring)
  # Monitoring: docker compose --profile monitoring up -d. Grafana at http://localhost:3000 shows the
  # API overview dashboard, traces (Tempo), logs (Loki) and alerts. See docs/monitoring.md.
  otel-collector:
    image: otel/opentelemetry-collector:0.165.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    # Loopback only: lets `dotnet run` on this machine send telemetry too.
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.9.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  alertmanager:
    image: prom/alertmanager:v0.35.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"

  tempo:
    image: grafana/tempo:3.1.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.7.10
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./monitoring/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:13.3.1
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Set GRAFANA_ADMIN_PASSWORD in .env; with the default, Grafana asks for a new one at first sign-in.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # Loopback only. Reach it from elsewhere through the tunnel, behind Cloudflare Access.
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

#endif
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - api
#if (UsePostgres || UseSqlServer)

volumes:
  db-data:
#elif (UseSqlite)

volumes:
  app-data:
#elif (UseMonitoring)

volumes:
#endif
#if (UseStorage)
  storage-data:
  upload-data:
  clamav-data:
#endif
#if (UseMonitoring)
  prometheus-data:
  alertmanager-data:
  tempo-data:
  loki-data:
  grafana-data:
#endif
