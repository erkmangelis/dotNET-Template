version: 2
updates:
  # The template's own test tooling.
  - package-ecosystem: nuget
    directory: /
    exclude-paths:
      - "templates/**"
      - "tests/Erkmangelis.Templates.Tests/Snapshots/**"
    schedule:
      interval: weekly
  # What generated projects get.
  - package-ecosystem: nuget
    directory: /templates/ek-api
    schedule:
      interval: weekly
    # A new .NET major version (11 on top of 10) is a release of its own: Docker images,
    # target framework and snapshots change together, so Dependabot leaves it alone.
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*", "dotnet-ef"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      tests:
        patterns: ["xunit*", "Testcontainers*"]
  - package-ecosystem: docker
    directory: /templates/ek-api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*dotnet/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /templates/ek-api
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directories: ["/", "/templates/ek-api"]
    schedule:
      interval: weekly
