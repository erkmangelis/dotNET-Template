name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack:
    name: Pack and snapshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Pack the template
        run: dotnet pack Erkmangelis.Templates.csproj -c Release -o artifacts
      - name: Snapshot tests
        run: dotnet test tests/Erkmangelis.Templates.Tests -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/*.nupkg
          if-no-files-found: error

  acceptance:
    # Every combination listed here is supported. Anything not listed is not.
    name: Acceptance (auth ${{ matrix.auth }}, db ${{ matrix.db }}, email ${{ matrix.email }}, jobs ${{ matrix.jobs }}, worker ${{ matrix.worker || false }}, aspire ${{ matrix.aspire || false }}, agents ${{ matrix.agents }})
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The combinations that change code. --agents only adds or removes AGENTS.md and
        # CLAUDE.md (a snapshot test proves it), so each value runs on a share of them. SQL Server
        # and SQLite run with every --auth mode; --email does not touch the database code. --jobs runs
        # each choice on every database, with and without sign-in. --worker (which means --jobs
        # hangfire) runs on every database; --aspire runs with and without a database and a worker.
        include:
          - { auth: none, db: none, email: none, jobs: none, agents: none }
          - { auth: none, db: none, email: smtp, jobs: none, agents: shared }
          - { auth: none, db: postgres, email: none, jobs: none, agents: claude }
          - { auth: none, db: postgres, email: smtp, jobs: none, agents: none }
          - { auth: identity, db: postgres, email: none, jobs: none, agents: shared }
          - { auth: identity, db: postgres, email: smtp, jobs: none, agents: claude }
          - { auth: external, db: postgres, email: none, jobs: none, agents: none }
          - { auth: external, db: postgres, email: smtp, jobs: none, agents: shared }
          - { auth: oidc, db: postgres, email: none, jobs: none, agents: claude }
          - { auth: oidc, db: postgres, email: smtp, jobs: none, agents: none }
          - { auth: none, db: sqlserver, email: none, jobs: none, agents: shared }
          - { auth: identity, db: sqlserver, email: smtp, jobs: none, agents: claude }
          - { auth: external, db: sqlserver, email: none, jobs: none, agents: none }
          - { auth: oidc, db: sqlserver, email: none, jobs: none, agents: shared }
          - { auth: none, db: sqlite, email: smtp, jobs: none, agents: claude }
          - { auth: identity, db: sqlite, email: none, jobs: none, agents: none }
          - { auth: external, db: sqlite, email: smtp, jobs: none, agents: shared }
          - { auth: oidc, db: sqlite, email: none, jobs: none, agents: claude }
          - { auth: none, db: none, email: none, jobs: hosted, agents: shared }
          - { auth: none, db: sqlserver, email: none, jobs: hosted, agents: claude }
          - { auth: identity, db: postgres, email: smtp, jobs: hosted, agents: none }
          - { auth: oidc, db: sqlite, email: none, jobs: hosted, agents: shared }
          - { auth: none, db: postgres, email: none, jobs: hangfire, agents: claude }
          - { auth: identity, db: postgres, email: none, jobs: hangfire, agents: shared }
          - { auth: oidc, db: sqlserver, email: none, jobs: hangfire, agents: none }
          - { auth: none, db: sqlite, email: smtp, jobs: hangfire, agents: shared }
          - { auth: none, db: postgres, email: none, jobs: none, worker: true, aspire: true, agents: shared }
          - { auth: identity, db: sqlserver, email: none, jobs: hangfire, worker: true, agents: claude }
          - { auth: oidc, db: postgres, email: none, jobs: hangfire, worker: true, agents: none }
          - { auth: none, db: sqlite, email: smtp, jobs: hangfire, worker: true, aspire: true, agents: none }
          - { auth: none, db: none, email: none, jobs: none, aspire: true, agents: claude }
          - { auth: identity, db: sqlserver, email: none, jobs: hosted, aspire: true, agents: shared }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v5
        with:
          name: package
          path: artifacts
      - name: Generate, build, test and run in docker compose
        run: >
          scripts/acceptance.sh
          --package "$(ls artifacts/*.nupkg)"
          --auth ${{ matrix.auth }} --db ${{ matrix.db }} --email ${{ matrix.email }} --jobs ${{ matrix.jobs }}
          --worker ${{ matrix.worker || false }} --aspire ${{ matrix.aspire || false }} --agents ${{ matrix.agents }}
          --compose

  images:
    name: API and worker images for amd64 and arm64
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v5
        with:
          name: package
          path: artifacts
      - name: Generate an API with a worker
        run: |
          dotnet new install "$(ls artifacts/*.nupkg)"
          dotnet new ek-api -n Acme.Notes -o "$RUNNER_TEMP/acme" --worker true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build both images for linux/amd64 and linux/arm64
        working-directory: ${{ runner.temp }}/acme
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --target worker .
          docker buildx build --platform linux/amd64,linux/arm64 --target final .

  supported:
    # One required check for branch protection.
    name: All supported combinations pass
    if: always()
    needs: [pack, acceptance, images]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [[ "${{ needs.pack.result }}" == success && "${{ needs.acceptance.result }}" == success && "${{ needs.images.result }}" == success ]]
