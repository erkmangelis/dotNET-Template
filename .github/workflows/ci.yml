name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack:
    name: Pack, tool tests and snapshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The update tests generate projects from released versions, so they need the tags.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Pack the template and the ek tool
        run: |
          dotnet pack Erkmangelis.Templates.csproj -c Release -o artifacts
          dotnet pack src/Erkmangelis.Ek -c Release -o artifacts
      - name: Tool tests
        run: dotnet test tests/Erkmangelis.Ek.Tests -c Release
      - name: Snapshot tests
        run: dotnet test tests/Erkmangelis.Templates.Tests -c Release
      - name: Acceptance matrix from the catalog
        id: matrix
        run: dotnet run --project src/Erkmangelis.Ek -c Release --no-build -- matrix --github >> "$GITHUB_OUTPUT"
      - name: Pack released versions for the update tests
        run: |
          for version in 0.1.0 0.3.0 0.4.0; do
            git worktree add "$RUNNER_TEMP/v$version" "v$version"
            dotnet pack "$RUNNER_TEMP/v$version/Erkmangelis.Templates.csproj" -c Release -o released
          done
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/*.nupkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: released-packages
          path: released/*.nupkg
          if-no-files-found: error

  acceptance:
    # Every preset, plus combinations that cover every pair of option values that can occur
    # together, computed from catalog/ by `ek matrix`. Anything the catalog's rules accept is
    # supported; the rules reject the rest with a reason.
    name: Acceptance (${{ matrix.name }}, auth ${{ matrix.auth }}, db ${{ matrix.db }}, email ${{ matrix.email }}, jobs ${{ matrix.jobs }}, worker ${{ matrix.worker }}, aspire ${{ matrix.aspire }}, agents ${{ matrix.agents }})
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pack.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v5
        with:
          name: package
          path: artifacts
      - name: Generate, build, test and run in docker compose
        run: >
          scripts/acceptance.sh
          --package "$(ls artifacts/Erkmangelis.Templates.*.nupkg)"
          --auth ${{ matrix.auth }} --db ${{ matrix.db }} --email ${{ matrix.email }} --jobs ${{ matrix.jobs }}
          --worker ${{ matrix.worker }} --aspire ${{ matrix.aspire }} --agents ${{ matrix.agents }}
          --compose

  update:
    # A project generated by a released version, with a file of its own, updated by `ek update`
    # to this version, must pass the same acceptance test.
    name: Update from ${{ matrix.from }} (auth ${{ matrix.auth }}, db ${{ matrix.db }}, email ${{ matrix.email }}, jobs ${{ matrix.jobs }}, worker ${{ matrix.worker }}, aspire ${{ matrix.aspire }}, agents ${{ matrix.agents }})
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { from: 0.1.0, auth: none, db: none, email: none, jobs: none, worker: false, aspire: false, agents: shared }
          - { from: 0.1.0, auth: identity, db: postgres, email: none, jobs: none, worker: false, aspire: false, agents: claude }
          - { from: 0.3.0, auth: external, db: sqlite, email: smtp, jobs: none, worker: false, aspire: false, agents: none }
          - { from: 0.4.0, auth: oidc, db: sqlserver, email: none, jobs: hangfire, worker: true, aspire: true, agents: claude }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v5
        with:
          name: package
          path: artifacts
      - uses: actions/download-artifact@v5
        with:
          name: released-packages
          path: released
      - name: Generate with the old version, update, build, test and run in docker compose
        run: >
          scripts/acceptance.sh
          --package "$(ls artifacts/Erkmangelis.Templates.*.nupkg)"
          --update-from released/Erkmangelis.Templates.${{ matrix.from }}.nupkg
          --auth ${{ matrix.auth }} --db ${{ matrix.db }} --email ${{ matrix.email }} --jobs ${{ matrix.jobs }}
          --worker ${{ matrix.worker }} --aspire ${{ matrix.aspire }} --agents ${{ matrix.agents }}
          --compose

  images:
    name: API and worker images for amd64 and arm64
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v5
        with:
          name: package
          path: artifacts
      - name: Generate an API with a worker
        run: |
          dotnet new install "$(ls artifacts/Erkmangelis.Templates.*.nupkg)"
          dotnet new ek-api -n Acme.Notes -o "$RUNNER_TEMP/acme" --worker true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build both images for linux/amd64 and linux/arm64
        working-directory: ${{ runner.temp }}/acme
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --target worker .
          docker buildx build --platform linux/amd64,linux/arm64 --target final .

  supported:
    # One required check for branch protection.
    name: All supported combinations pass
    if: always()
    needs: [pack, acceptance, update, images]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [[ "${{ needs.pack.result }}" == success && "${{ needs.acceptance.result }}" == success && "${{ needs.update.result }}" == success && "${{ needs.images.result }}" == success ]]
