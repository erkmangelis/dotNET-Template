# Push a tag like v0.1.0 to publish. The tag must match <Version> in Erkmangelis.Templates.csproj
# and in src/Erkmangelis.Ek/Erkmangelis.Ek.csproj.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Check the tag matches the package version
        run: |
          for project in Erkmangelis.Templates.csproj src/Erkmangelis.Ek/Erkmangelis.Ek.csproj; do
            version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$project")"
            [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME does not match version $version in $project"; exit 1; }
          done
      - name: Pack
        run: |
          dotnet pack Erkmangelis.Templates.csproj -c Release -o artifacts -p:ContinuousIntegrationBuild=true
          dotnet pack src/Erkmangelis.Ek -c Release -o artifacts -p:ContinuousIntegrationBuild=true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: artifacts/*.nupkg
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## / {f=0} f' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "$GITHUB_REF_NAME" --notes "$notes"
